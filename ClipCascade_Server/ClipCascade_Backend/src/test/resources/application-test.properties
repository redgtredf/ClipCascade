# ---------------------------------------
# Test profile: DUMMY values only - safe to commit. Never use real secrets here.
# ---------------------------------------

# In-memory database (no files written)
spring.datasource.url=jdbc:h2:mem:clipcascade-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mandatory production values satisfied with dummy values
CC_SERVER_DB_PASSWORD=dummy-db-password
CC_ADMIN_USERNAME=test-admin
CC_ADMIN_PASSWORD=DummyAdminPass123

# Explicit non-wildcard origins (wildcard would fail startup outside 'local-test')
CC_ALLOWED_ORIGINS=http://localhost:8080
